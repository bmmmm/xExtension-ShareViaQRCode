name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout source code
        uses: actions/checkout@v7

      # Pinned to the oldest PHP that FreshRSS 1.29 supports, so a syntax feature
      # newer than the declared floor fails here rather than at a user's install.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Check PHP syntax
        run: |
          php -v
          find . \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n1 php -l

      - name: Check metadata.json is valid JSON
        run: |
          python3 -c "import json,sys; d=json.load(open('metadata.json')); \
            [sys.exit('missing key: ' + k) for k in ('name','entrypoint','type','version') if k not in d]"

      - name: Check the entrypoint matches the class name
        run: |
          entry=$(python3 -c "import json; print(json.load(open('metadata.json'))['entrypoint'])")
          grep -q "class ${entry}Extension" extension.php \
            || { echo "extension.php has no class ${entry}Extension"; exit 1; }

      - name: Check JavaScript syntax
        run: |
          node --version
          find static -name '*.js' -print0 | xargs -0 -n1 node --check

      # The bundled QR library is third-party code that runs in every user's
      # browser. Any edit to it has to show up as a checksum change in the diff.
      - name: Check the bundled library is unmodified
        run: |
          cd static/vendor
          sha256sum -c qrcode.js.sha256
          # Guard the guard: a checksum file that lost its entry still exits 0.
          test "$(grep -c 'qrcode\.js$' qrcode.js.sha256)" -eq 1 \
            || { echo 'qrcode.js.sha256 does not cover qrcode.js'; exit 1; }

      - name: Run the tracking-parameter tests
        run: |
          set -o pipefail   # otherwise the pipe below reports tee's exit code
          # Pin the reporter: the default differs between Node versions and the
          # guard below parses its output. The whole directory, not one file by
          # name, so a test added tomorrow cannot be silently skipped. The glob
          # rather than `tests/`: newer Node reads a bare directory as a module
          # path and reports zero tests.
          node --test --test-reporter=tap tests/*.test.js | tee test.log
          # `node --test` exits 0 on a skipped run, and an empty file still
          # reports `# pass 1`, so count the cases that are meant to run.
          expected=$(cat tests/*.test.js | grep -c '^test(')
          passed=$(sed -n 's/^# pass \([0-9]*\)$/\1/p' test.log)
          skipped=$(sed -n 's/^# skipped \([0-9]*\)$/\1/p' test.log)
          echo "expected=${expected} passed=${passed:-0} skipped=${skipped:-0}"
          test "${passed:-0}" -eq "${expected}" \
            || { echo "expected ${expected} passing tests, got ${passed:-0}"; exit 1; }
          test "${skipped:-0}" -eq 0 || { echo 'a test was skipped'; exit 1; }

      # The JS fallback strings are what a user sees in the window before the
      # global context arrives. Add a key to jsVars and forget this map, and that
      # window shows "undefined".
      - name: Check the JS fallback strings cover every key sent to the browser
        run: |
          php -r '
            preg_match("/\x27i18n\x27 => \[(.*?)\n\t\t\t\]/s", file_get_contents("extension.php"), $m);
            preg_match_all("/\x27([a-z_]+)\x27 =>/", $m[1] ?? "", $php);
            preg_match("/FALLBACK_I18N = \{(.*?)\n\t\};/s", file_get_contents("static/script.js"), $j);
            preg_match_all("/^\t\t([a-z_]+):/m", $j[1] ?? "", $js);
            $sent = $php[1]; $fallback = $js[1];
            if (count($sent) < 5 || count($fallback) < 5) {
              fwrite(STDERR, "pattern matched too little: " . count($sent) . " sent, " . count($fallback) . " fallback\n");
              exit(1);
            }
            $missing = array_diff($sent, $fallback);
            if ($missing !== []) {
              fwrite(STDERR, "FALLBACK_I18N is missing: " . implode(", ", $missing) . "\n");
              exit(1);
            }
            echo count($sent), " keys sent to the browser, all present in FALLBACK_I18N\n";
          '

      - name: Check every translation key used by the extension exists
        run: |
          php -r '
            $source = "";
            foreach (["extension.php", "configure.phtml"] as $file) {
              $source .= file_get_contents($file);
            }
            preg_match_all("/_t\(.ext\.share_via_qr_code\.([a-z_.]+)./", $source, $m);
            // A capture ending in a dot comes from a key built at runtime
            // (`.target.` . $target); the constant part alone is not a key.
            $keys = array_values(array_filter(array_unique($m[1]), fn(string $k): bool => !str_ends_with($k, ".")));
            if (count($keys) < 10) {
              fwrite(STDERR, "only {$keys[0]}... " . count($keys) . " keys found - did the pattern stop matching?\n");
              exit(1);
            }
            echo count($keys), " keys used\n";
            foreach (glob("i18n/*/ext.php") as $file) {
              $flat = [];
              $walk = function (array $node, string $prefix) use (&$walk, &$flat): void {
                foreach ($node as $key => $value) {
                  is_array($value) ? $walk($value, "$prefix$key.") : $flat[] = "$prefix$key";
                }
              };
              $walk(require $file, "");
              foreach ($keys as $key) {
                if (!in_array("share_via_qr_code.$key", $flat, true)) {
                  fwrite(STDERR, "$file is missing share_via_qr_code.$key\n");
                  exit(1);
                }
              }
              echo "$file ok\n";
            }
          '

      # Everything above needs nothing but the runner. The linters below pull
      # a toolchain over the network, and a failure there used to skip every
      # remaining step — including the checksum guard and the tests.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install JS dev dependencies
        run: pnpm install --frozen-lockfile

      # static/vendor/ is excluded in eslint.config.mjs: third-party, untouched.
      - name: Check JavaScript style (ESLint)
        run: pnpm run eslint

      # PHPStan needs the FreshRSS core classes this extension extends
      # (Minz_Extension and friends), which do not live in this repository.
      # Mirrors how github.com/FreshRSS/Extensions lints third-party extensions:
      # check core out as a sibling directory purely to resolve those classes,
      # excluded from analysis itself (see phpstan.neon).
      - name: Git checkout FreshRSS core for PHPStan
        uses: actions/checkout@v7
        with:
          repository: FreshRSS/FreshRSS
          # The oldest release this extension supports, so using anything newer
          # than it fails the build rather than a stranger's install.
          ref: '1.29.0'
          path: .freshrss-core
          persist-credentials: false

      - name: Use Composer cache
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dev dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check PHP code style (PHP_CodeSniffer, FreshRSS' ruleset)
        run: vendor/bin/phpcs .

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress
